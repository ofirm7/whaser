// Reusable chat allow-list picker (used by the wizard and by "Edit chats"). Renders into
// `container`; calls onSave(chats, saveBtn) when the user confirms. Falls back to a link prompt
// when WhatsApp isn't connected.
// --- WhatsApp avatar helpers: initials fallback rendered instantly, photo swapped in lazily ---
const _waPhotoCache = new Map(); // jid -> Promise<string|null> (dedupes in-flight + caches result)
// Throttle photo fetches to a few at a time so 100 avatars never saturate the browser's
// ~6-connection-per-host pool (which would stall navigation/other requests).
let _waInflight = 0; const _waQ = [];
function _waPump(){ while(_waInflight < 5 && _waQ.length){ const it=_waQ.shift(); _waInflight++;
  api('/api/wa/photo?jid='+encodeURIComponent(it.jid)).then(r=>(r&&r.url)||null).catch(()=>null).then(u=>{ _waInflight--; it.res(u); _waPump(); }); } }
function waPhoto(jid){ if(!_waPhotoCache.has(jid)){ _waPhotoCache.set(jid, new Promise(res=>{ _waQ.push({jid,res}); _waPump(); })); } return _waPhotoCache.get(jid); }
function waInitials(name){ const s=String(name||'').trim(); if(!s) return '?'; const p=s.split(/\s+/); return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }
function avatarEl(c, size){ size=size||32; const a=$('<span class="wa-av"></span>'); a.style.width=a.style.height=size+'px'; a.style.lineHeight=size+'px'; a.style.fontSize=Math.round(size*0.4)+'px'; a.textContent=waInitials(c.name); a.title=c.name;
  if(c.isGroup) a.classList.add('grp');
  waPhoto(c.id).then(url=>{ if(!url) return; const img=new Image(); img.onload=()=>{ a.textContent=''; a.style.backgroundImage='url("'+url+'")'; a.classList.add('img'); }; img.src=url; });
  return a; }

// opts.allowEmpty: let the caller finish with ZERO chats selected — and even with no WhatsApp
// linked at all. Publishing must never be gated on the WhatsApp link, or a brand-new user's
// freshly designed agent is unreachable and lost; chats are bindable later from the agent page.
// Join a WhatsApp group from its invite link: preview it, then the workspace's linked WhatsApp joins (business
// numbers can't join groups). With opts.agentId that agent answers there straight away; opts.onJoined(chat)
// runs after a join (not after a join request that still needs an admin's approval).
async function buildGroupJoin(container, opts){
  opts=opts||{};
  const box=$('<div class="card" style="margin-top:8px"></div>'); container.innerHTML=''; container.appendChild(box);
  box.innerHTML=`<b>${t('👥 Add to a WhatsApp group')}</b>
    <div class="muted" style="margin:4px 0 8px">${t("Paste the group's invite link (in WhatsApp: group info → Invite via link). Your linked WhatsApp joins the group, and the agent answers there.")}</div>
    <div class="row"><input class="gj-link" dir="ltr" autocomplete="off" placeholder="https://chat.whatsapp.com/…"/><button class="gj-preview">${t('Preview')}</button></div>
    <div class="gj-out" style="margin-top:8px"></div>`;
  const q=(c)=>box.querySelector(c), out=q('.gj-out');
  let st; try{ st=await api('/api/wa/status'); }catch{ st={status:'disconnected'}; }
  if (st.status!=='connected'){
    q('.gj-link').disabled=true; q('.gj-preview').disabled=true;
    out.innerHTML=`<div class="muted">${t("Groups are joined by your linked WhatsApp account — WhatsApp business numbers can't join groups. Link a WhatsApp account first; a spare number works best, since that's how the agent appears in the group.")}</div>
      <button class="primary gj-go" style="margin-top:8px">${t('Link a WhatsApp account')}</button>`;
    q('.gj-go').onclick=()=>{ view='whatsapp'; render(); };
    return;
  }
  const preview=async()=>{ const link=q('.gj-link').value.trim(); if(!link) return;
    const pb=q('.gj-preview'); pb.disabled=true; out.innerHTML=`<span class="muted">${t('Looking up the group…')}</span>`;
    try{ const g=await api('/api/wa/groups/preview','POST',{ link });
      const notes=[ g.member?t('Your linked WhatsApp is already in this group.'):'', g.approvalRequired&&!g.member?t('A group admin has to approve the join request.'):'',
        g.adminsOnly?t("⚠ Only admins can send messages in this group — the agent can't reply there unless an admin makes it one."):'' ].filter(Boolean);
      const label = opts.agentId ? (g.member?t('Answer in this group'):t('Join and answer here')) : (g.member?t('Add this group'):t('Join group'));
      out.innerHTML=`<div class="card" style="margin:0;padding:10px 12px"><b dir="auto">👥 ${esc(g.name)}</b> <span class="muted">· ${esc(tf('{0} members', g.size))}</span>
        ${notes.map(n=>`<div class="muted" style="margin-top:4px;font-size:13.5px">${esc(n)}</div>`).join('')}
        <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="primary gj-join">${esc(label)}</button><span class="gj-msg" style="font-size:13.5px"></span></div></div>`;
      q('.gj-join').onclick=async()=>{ const jb=q('.gj-join'); jb.disabled=true; q('.gj-msg').innerHTML=`<span class="muted">${t('Joining…')}</span>`;
        try{ const r=await api('/api/wa/groups/join','POST',{ link, agentId: opts.agentId||undefined });
          if (r.pending){ out.innerHTML=`<div class="ok">${t('Join request sent. Once a group admin approves it, the group appears in your chats — then choose it under ✏️ Edit chats.')}</div>`; return; }
          out.innerHTML=`<div class="ok" dir="auto">${esc(opts.agentId?tf('✓ Joined “{0}” — the agent answers there now.', r.chat.name):tf('✓ Joined “{0}”.', r.chat.name))}</div>`;
          q('.gj-link').value='';
          if (opts.onJoined) opts.onJoined(r.chat); }
        catch(e){ q('.gj-msg').innerHTML=`<span class="err">${esc(t(e.message))}</span>`; jb.disabled=false; } };
    }catch(e){ out.innerHTML=`<div class="err">${esc(t(e.message))}</div>`; }
    pb.disabled=false; };
  q('.gj-preview').onclick=preview;
  q('.gj-link').addEventListener('keydown', e=>{ if(e.key==='Enter') preview(); });
}

async function buildChatPicker(container, preselected, saveLabel, onSave, opts){
  const allowEmpty = !!(opts && opts.allowEmpty);
  container.innerHTML='';
  const box=$('<div class="card" style="margin-top:8px"></div>'); container.appendChild(box);
  let st; try{ st=await api('/api/wa/status'); }catch{ st={status:'disconnected'}; }
  if (st.status!=='connected'){
    box.innerHTML=`<div class="muted">${t('Your WhatsApp isn\'t linked yet — link it to choose chats.')}</div>`;
    const lb=$(`<button class="${allowEmpty?'':'primary'}" style="margin-top:8px">${t('Link my WhatsApp')}</button>`);
    lb.onclick=async()=>{ lb.disabled=true; try{ await api('/api/wa/link','POST'); }catch{}
      const poll=setInterval(async()=>{ let s; try{ s=await api('/api/wa/status'); }catch{ return; }
        if(s.status==='qr'&&s.qrDataUrl){ box.innerHTML=`<div>${t('Scan in WhatsApp → Settings → Linked devices → Link a device:')}</div><img alt="${t('WhatsApp QR')}" src="`+s.qrDataUrl+'" style="width:240px;height:240px;background:#fff;border-radius:8px;margin-top:8px"/>'; }
        if(s.status==='connected'){ clearInterval(poll); buildChatPicker(container, preselected, saveLabel, onSave, opts); } }, 2500); };
    box.appendChild(lb);
    if (allowEmpty){
      box.appendChild($(`<div class="muted" style="margin-top:10px">${t('No link yet? Continue without chats — the agent is saved now, and you can bind chats later from its page.')}</div>`));
      const sb=$('<button class="primary" style="margin-top:8px"></button>'); sb.textContent=saveLabel;
      sb.onclick=()=> onSave([], sb); box.appendChild(sb);
    }
    return;
  }
  const selected=new Map((preselected||[]).map(c=>[c.id,{id:c.id,name:c.name,isGroup:String(c.id).endsWith('@g.us')}]));
  box.innerHTML=`<b>${t('Which chats should this agent answer?')}</b><div class="muted" style="margin:4px 0 8px">${t('Search your contacts and groups by name or number, then tick the ones to listen on.')}</div>`;
  const search=$(`<input placeholder="${t('Search chats/contacts…')}"/>`); box.appendChild(search);
  const chips=$('<div style="margin:8px 0"></div>'); box.appendChild(chips);
  const results=$('<div style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:6px"></div>'); box.appendChild(results);
  const joinToggle=$(`<button class="ghost" style="margin-top:8px">${t('👥 Not in the group yet? Join with an invite link')}</button>`); box.appendChild(joinToggle);
  const joinBox=$('<div></div>'); box.appendChild(joinBox);
  joinToggle.onclick=()=>{ if(joinBox.childElementCount){ joinBox.innerHTML=''; return; }
    buildGroupJoin(joinBox, { onJoined:(chat)=>{ selected.set(chat.id,{ id:chat.id, name:chat.name, isGroup:true }); renderChips(); doSearch(); } }); };
  const save=$('<button class="primary" style="margin-top:10px;display:block"></button>'); save.disabled=!allowEmpty; save.textContent=saveLabel; box.appendChild(save);
  function renderChips(){ chips.innerHTML='';
    if(!selected.size){ chips.appendChild($(`<span class="muted">${t('none selected yet')}</span>`)); save.disabled=!allowEmpty; return; }
    [...selected.values()].forEach(c=>{ const pill=$('<span class="pill" style="display:inline-flex;align-items:center;gap:5px;margin:2px"></span>');
      pill.appendChild(avatarEl(c,18)); const tn=$('<span dir="auto"></span>'); tn.textContent=c.name; pill.appendChild(tn);
      if(c.isGroup) pill.appendChild($('<span>👥</span>')); chips.appendChild(pill); });
    save.disabled=false; }
  async function doSearch(){ let r; try{ r=await api('/api/wa/chats?q='+encodeURIComponent(search.value.trim())); }catch{ r={chats:[]}; }
    results.innerHTML = r.chats.length ? '' : `<span class="muted">${t('No matches (try a name or number; chats appear after they sync).')}</span>`;
    r.chats.forEach(c=>{ const row=$('<label class="chatrow"></label>');
      const cb=$('<input type="checkbox"/>'); cb.checked=selected.has(c.id);
      const name=$('<span dir="auto" class="chatname"></span>'); name.textContent=c.name||c.id.split('@')[0].split(':')[0];
      const badge=$(`<span class="chatbadge" title="${c.isGroup?t('Group'):''}">${c.isGroup?'👥':''}</span>`);
      row.appendChild(cb); row.appendChild(avatarEl(c,34)); row.appendChild(name); row.appendChild(badge);
      cb.onchange=(e)=>{ if(e.target.checked) selected.set(c.id,{id:c.id,name:c.name,isGroup:c.isGroup}); else selected.delete(c.id); renderChips(); };
      results.appendChild(row); }); }
  let tm; search.addEventListener('input', ()=>{ clearTimeout(tm); tm=setTimeout(doSearch, 300); });
  save.onclick=()=> onSave([...selected.values()].map(c=>({id:c.id,name:c.name})), save);
  renderChips(); doSearch();
}

// Google connections picker (create wizard + agent page): tick Gmail / Google Calendar / Google Drive and
// choose Read only or Read & write for each, then "Sign in with Google" in a pop-up when the ticked access
// isn't granted yet — nothing to set up first (the Google app belongs to the Whaser server). Returns
// { get } → the selection, e.g. { gmail:'read_write' }.
const GOOGLE_SERVICES = [
  { k:'gmail', icon:'📧', name:'Gmail', read:'search and read email', write:'+ send, draft, mark read/archive' },
  { k:'calendar', icon:'📅', name:'Google Calendar', read:'see events and availability', write:'+ create, change and delete events' },
  { k:'drive', icon:'📁', name:'Google Drive', read:'search and read files', write:'+ create and update files' },
];
function googleCovers(granted, k, access){ const g=(granted||{})[k]; return access==='read' ? !!g : g==='read_write'; }
function connectionPills(conns){ return GOOGLE_SERVICES.filter(s=>conns&&conns[s.k]).map(s=>`<span class="pill">${s.icon} ${esc(t(s.name))} · ${esc(conns[s.k]==='read_write'?t('Read & write'):t('Read only'))}</span>`).join(''); }
const GOOGLE_G = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
// The standard "Sign in with Google" button (Google's branding: white, grey outline, the G logo).
function googleButton(){ const b=$(`<button type="button" class="gbtn">${GOOGLE_G}<span></span></button>`); b.querySelector('span').textContent=t('Sign in with Google'); return b; }
// Open Google's sign-in pop-up asking for `services` ({ gmail:'read', … }; {} = just sign in). Call it
// inside a click so the pop-up isn't blocked. onUpdate(expired) runs whenever the result may have changed
// — the pop-up reported back, or every 2.5s — and once with expired=true after 10 minutes; the caller
// calls stop() when it's done waiting. Returns { blockedUrl, stop }, or null if it couldn't start.
async function startGoogleSignIn(services, onUpdate){
  const w=window.open('', 'whaser-google', 'width=520,height=680'); // opened inside the click so it isn't blocked
  let url;
  try{ ({ url }=await api('/api/google/connect','POST',{ services })); }
  catch(e){ if(w) w.close(); alert(t(e.message)); return null; }
  const blockedUrl = (w && !w.closed) ? (w.location.href=url, null) : url;
  const end=Date.now()+10*60*1000;
  const onMsg=(e)=>{ if(e.origin===location.origin && e.data && e.data.type==='whaser-google') onUpdate(false); };
  const poll=setInterval(()=>onUpdate(Date.now()>end), 2500);
  window.addEventListener('message', onMsg);
  return { blockedUrl, stop(){ clearInterval(poll); window.removeEventListener('message', onMsg); } };
}
function googleWaitingNote(signin){
  const d=$(`<div style="margin-top:8px"><div class="muted">${t('Waiting for Google sign-in… finish it in the pop-up window.')}</div></div>`);
  if(signin.blockedUrl){ const a=$(`<a target="_blank" rel="opener" style="display:inline-block;margin-top:4px">${t('Pop-up blocked — open Google sign-in')}</a>`); a.href=signin.blockedUrl; d.appendChild(a); }
  return d;
}
// Shown with "Sign in with Google": what Whaser does with Google data, and where the privacy policy is.
function googlePrivacyNote(){ return $(`<div class="muted" style="font-size:12.5px;margin-top:8px">${t('Whaser uses your Google data only for what you let your agents do — never for ads or AI training.')} <a href="/privacy#google" target="_blank" rel="noopener">${t('Privacy policy')}</a></div>`); }
async function confirmGoogleDisconnect(){
  return confirmDialog({ title:t('Disconnect Google?'), message:t('Every agent in this workspace loses access to your Gmail, Calendar and Drive until you sign in with Google again.'), confirmLabel:t('Disconnect Google'), danger:true });
}

function buildConnectionsPicker(container, preset, opts){
  const sel={...(preset||{})};
  const suggested = !!(opts && opts.suggested) && Object.keys(sel).length>0;
  const box=$('<div class="card" style="margin-top:8px"></div>'); container.innerHTML=''; container.appendChild(box);
  let st=null, signin=null; // signin: the Google pop-up being waited on
  const alive=()=>document.body.contains(box);
  const missing=()=>Object.entries(sel).filter(([k,acc])=>!(st&&st.connected&&googleCovers(st.granted,k,acc)));
  const stopWaiting=()=>{ if(signin){ signin.stop(); signin=null; } };
  async function load(){ try{ st=await api('/api/google/status'); }catch{ st=st||{ configured:false, connected:false, granted:{} }; } }
  async function check(expired){
    if(!alive()){ stopWaiting(); return; }
    await load();
    if((st.connected && !missing().length) || expired) stopWaiting();
    paint();
  }
  async function connect(btn){
    btn.disabled=true; stopWaiting();
    signin=await startGoogleSignIn({ ...sel }, check);
    paint();
  }
  async function disconnect(){
    if(!(await confirmGoogleDisconnect())) return;
    try{ st=await api('/api/google/disconnect','POST'); }catch(e){ alert(e.message); }
    paint();
  }
  function paint(){
    box.innerHTML=`<b>${t('🔗 Google connections')}</b>
      <div class="muted" style="margin:4px 0 8px">${t('Let this agent use your Gmail, Google Calendar and Google Drive — pick Read only or Read & write for each.')}
      ${opts&&opts.optional?' '+t("Optional — you can also add these later from the agent's page."):''}</div>`;
    if(!st){ box.appendChild($(`<div class="muted">${t('Loading…')}</div>`)); return; }
    if(!st.configured){ box.appendChild($(`<div class="muted">${t("Sign in with Google isn't turned on for this Whaser server yet. Please ask your Whaser administrator.")}</div>`)); return; }
    if(suggested) box.appendChild($(`<div class="muted" style="margin-bottom:6px">${t('Pre-selected from your conversation — change anything you like.')}</div>`));
    for(const s of GOOGLE_SERVICES){
      const on=!!sel[s.k], acc=sel[s.k]||'read_write';
      const row=$('<div class="row" style="flex-wrap:wrap;gap:8px;padding:8px 0;border-top:1px solid var(--line)"></div>');
      row.innerHTML=`<label class="row" style="gap:10px;margin:0;flex:1;min-width:220px;color:var(--text);font-size:15px;cursor:pointer">
          <input type="checkbox" style="width:17px;height:17px;min-width:17px;margin:0;accent-color:var(--accent)"${on?' checked':''}/>
          <span>${s.icon} <b>${esc(t(s.name))}</b><div class="muted" style="font-size:12.5px">${esc(t(s.read))}${acc==='read_write'?' '+esc(t(s.write)):''}</div></span></label>
        <select${on?'':' disabled'}><option value="read"${acc==='read'?' selected':''}>${t('Read only')}</option><option value="read_write"${acc==='read_write'?' selected':''}>${t('Read & write')}</option></select>
        <span style="font-size:12.5px;min-width:120px">${on?(st.connected&&googleCovers(st.granted,s.k,acc)?`<span class="ok">${t('✓ access granted')}</span>`:`<span class="muted">${t('needs Google sign-in')}</span>`):''}</span>`;
      row.querySelector('input').onchange=(e)=>{ if(e.target.checked) sel[s.k]=acc; else delete sel[s.k]; paint(); };
      row.querySelector('select').onchange=(e)=>{ sel[s.k]=e.target.value; paint(); };
      box.appendChild(row);
    }
    const foot=$('<div style="border-top:1px solid var(--line);padding-top:10px"></div>'); box.appendChild(foot);
    if(st.connected){
      const line=$(`<div class="row" style="flex-wrap:wrap;gap:8px"><span class="ok"></span><button class="ghost" style="margin-inline-start:auto">${t('Disconnect Google')}</button></div>`);
      line.querySelector('.ok').textContent=tf('✓ Signed in with Google as {0}', st.email||st.connectedBy||'Google');
      line.querySelector('button').onclick=disconnect; foot.appendChild(line);
    }
    if(missing().length){
      foot.appendChild($(`<div class="muted" style="margin:8px 0">${st.connected?t('To allow the access you picked, sign in with Google again.'):t('Sign in with your Google account — Google shows you exactly what this agent will be allowed to do.')}</div>`));
      const gb=googleButton(); gb.onclick=()=>connect(gb); foot.appendChild(gb); foot.appendChild(googlePrivacyNote());
    } else if(!st.connected) foot.appendChild($(`<div class="muted">${t('Tick what this agent may use, then sign in with Google.')}</div>`));
    if(signin) foot.appendChild(googleWaitingNote(signin));
    if(Object.keys(sel).length) box.appendChild($(`<div class="card" style="border-color:var(--danger);margin:10px 0 0;padding:10px 12px;font-size:13.5px">${t('⚠️ Anyone who can message this agent can ask it to use what you connect here — for example to read your email or, with Read & write, to send email as you. Connect only what this agent needs.')}</div>`));
  }
  paint(); load().then(paint);
  // Nothing can be connected while Sign in with Google is off on the server — never save a dead connection.
  return { get: ()=>(st && !st.configured ? {} : { ...sel }) };
}

// Settings → Connected accounts: the workspace's Google account — Sign in with Google (asking for what its
// agents use between them, or just signing in), who's signed in, what Google allows, and Disconnect.
function buildGoogleAccountCard(container){
  let st=null, signin=null;
  const alive=()=>document.body.contains(container);
  const missing=()=>Object.entries((st&&st.agentsUse)||{}).filter(([k,acc])=>!(st.connected&&googleCovers(st.granted,k,acc)));
  const stopWaiting=()=>{ if(signin){ signin.stop(); signin=null; } };
  async function load(){ try{ st=await api('/api/google/status'); }catch(e){ st=st||{ error:e.message }; } }
  async function check(expired){
    if(!alive()){ stopWaiting(); return; }
    await load();
    if((st.connected && !missing().length) || expired) stopWaiting();
    paint();
  }
  async function signIn(btn){
    btn.disabled=true; stopWaiting();
    signin=await startGoogleSignIn(Object.fromEntries(missing().length?missing():[]), check);
    paint();
  }
  function paint(){
    container.innerHTML=`<div class="row" style="gap:12px;align-items:flex-start">
        <span class="glogo">${GOOGLE_G}</span>
        <div style="flex:1;min-width:0"><b>Google</b><div class="muted" style="font-size:13px">${esc(t('Gmail, Google Calendar, Google Drive'))}</div><div class="g-body" style="margin-top:8px"></div></div></div>`;
    const body=container.querySelector('.g-body');
    if(!st){ body.innerHTML=`<span class="muted">${t('Loading…')}</span>`; return; }
    if(st.error){ body.innerHTML=`<span class="err">${esc(st.error)}</span>`; return; }
    if(!st.configured){ body.innerHTML=`<span class="muted">${t("Sign in with Google isn't turned on for this Whaser server yet. Please ask your Whaser administrator.")}</span>`; return; }
    const need=missing(), use=connectionPills(st.agentsUse||{});
    if(st.connected){
      const pills=connectionPills(st.granted||{});
      body.appendChild($(`<div class="ok"></div>`)).textContent=tf('✓ Signed in with Google as {0}', st.email||'Google');
      if(st.connectedBy) body.appendChild($(`<div class="muted" style="font-size:13px"></div>`)).textContent=tf('by {0}', st.connectedBy);
      if(pills) body.appendChild($(`<div style="margin-top:6px"><span class="muted" style="font-size:13px">${t('Google allows:')}</span> ${pills}</div>`));
      body.appendChild($(`<div class="muted" style="font-size:13px;margin-top:4px">${t('Each agent only gets what you pick for it on its page.')}</div>`));
      if(need.length) body.appendChild($(`<div class="err" style="font-size:13.5px;margin-top:8px">${t('⚠ Some of your agents need more Google access:')} ${connectionPills(Object.fromEntries(need))}</div>`));
    } else {
      body.appendChild($(`<div class="muted">${use?`${t('Not signed in yet. Your agents use:')} ${use}`:t('Not signed in yet. Sign in once — then choose, on each agent\'s page, whether it may use your Gmail, Calendar or Drive.')}</div>`));
    }
    const actions=$('<div class="row" style="flex-wrap:wrap;gap:10px;margin-top:10px"></div>'); body.appendChild(actions); body.appendChild(googlePrivacyNote());
    if(!st.connected || need.length){ const gb=googleButton(); gb.onclick=()=>signIn(gb); actions.appendChild(gb); }
    if(st.connected){
      const b=$(`<button class="ghost">${t('Disconnect Google')}</button>`); actions.appendChild(b);
      b.onclick=async()=>{ if(!(await confirmGoogleDisconnect())) return; b.disabled=true;
        try{ st={ ...(await api('/api/google/disconnect','POST')), agentsUse:st.agentsUse }; }catch(e){ alert(e.message); }
        paint(); };
    }
    if(signin) body.appendChild(googleWaitingNote(signin));
  }
  paint(); load().then(paint);
}

// The workspace's WhatsApp business number, given out from the operator's Twilio account — one click,
// nothing to copy from an outside console. The status block refreshes on its own so the owner sees their
// test message arrive.
async function buildTwilioSettings(container){
  container.innerHTML=`<span class="muted">${t('Loading…')}</span>`;
  let s; try{ s=await api('/api/settings/twilio'); }catch(e){ container.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  const when=(ms)=>new Date(ms).toLocaleString(locale());
  function statusHtml(){
    if(!s.number) return '';
    const a=s.activity||{};
    return [
      s.agentName ? `<div>${tf('Answered by <b>{0}</b>', esc(s.agentName))}</div>`
        : `<div class="err">${t('No agent answers this number yet — open an agent and click “📲 Answer on WhatsApp”.')}</div>`,
      `<div class="muted" style="margin-top:4px">${a.lastInboundAt ? esc(tf('Last message received: {0} from {1}', when(a.lastInboundAt), ltr(a.lastInboundFrom||''))) : t('No message received yet — send one to the number from WhatsApp to try it.')}</div>`,
      a.lastReplyAt ? `<div class="muted">${esc(tf('Last reply sent: {0}', when(a.lastReplyAt)))}</div>` : '',
      a.lastProblem ? `<div class="err" style="margin-top:4px" dir="auto">⚠ ${esc(a.lastProblem.message)} <span class="muted">(${esc(when(a.lastProblem.at))})</span></div>` : '',
    ].join('');
  }
  function paint(note){
    let body;
    if(!s.available) body=`<div class="muted" style="margin-top:8px">${t("WhatsApp business numbers aren't available on this server yet.")}</div>`;
    else if(!s.number) body = s.freeNumbers>0
      ? `<div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="primary tw-claim">${t('Get a WhatsApp number')}</button><span class="tw-msg" style="font-size:13.5px">${note||''}</span></div>`
      : `<div class="err" style="margin-top:8px">${t('All WhatsApp numbers on this server are taken. Ask the Whaser operator to add another.')}</div>`;
    else body=`<div style="margin-top:12px;font-size:16px"><b>${esc(tf('Your WhatsApp number: {0}', ltr(s.number)))}</b></div>
      ${s.sandbox ? (s.sandboxJoin
        ? `<div class="muted" style="margin-top:6px">${esc(tf("This is Twilio's test number. Before messaging it, each person sends “{0}” to it once (and again every 3 days).", s.sandboxJoin.text))}</div>
           <a href="${esc(s.sandboxJoin.link)}" target="_blank" rel="noopener"><button style="margin-top:8px">${t('Open WhatsApp to join')}</button></a>`
        : `<div class="muted" style="margin-top:6px">${t("This is Twilio's test number. Before messaging it, each person sends the Sandbox join message to it once (and again every 3 days) — ask the Whaser operator for it.")}</div>`) : ''}
      <div class="tw-status" style="margin-top:12px">${statusHtml()}</div>
      <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="ghost tw-release">${t('Release number')}</button><span class="tw-msg" style="font-size:13.5px">${note||''}</span></div>`;
    container.innerHTML=`<h2 style="margin-bottom:6px">${t('📲 WhatsApp business number')}</h2>
      ${s.problem?`<div class="card" style="border-color:var(--danger);margin:6px 0 10px;padding:10px 12px"><span class="err">⚠ ${esc(s.problem)}</span></div>`:''}
      <div class="muted">${t('Give your agents their own official WhatsApp business number — no QR and no personal phone. Everyone who messages it talks to the agent you choose.')}</div>
      ${body}`;
    const q=(c)=>container.querySelector(c);
    const msg=(html)=>{ const m=q('.tw-msg'); if(m) m.innerHTML=html; };
    const claim=q('.tw-claim');
    if(claim) claim.onclick=async()=>{ claim.disabled=true;
      try{ s=await api('/api/settings/twilio/claim','POST'); paint(); }
      catch(e){ msg(`<span class="err">${esc(e.message)}</span>`); claim.disabled=false; } };
    const rel=q('.tw-release');
    if(rel) rel.onclick=async()=>{ const ok=await confirmDialog({ title:t('Release this number?'), message:tf('Your agents stop answering {0}, and another workspace can take it.', ltr(s.number)), confirmLabel:t('Release'), danger:true });
      if(!ok) return; rel.disabled=true;
      try{ s=await api('/api/settings/twilio','DELETE'); paint(); }catch(e){ msg(`<span class="err">${esc(e.message)}</span>`); rel.disabled=false; } };
  }
  paint();
  // Refresh just the status block; stops once the page is left.
  const timer=setInterval(async()=>{
    if(!container.isConnected){ clearInterval(timer); return; }
    try{ const r=await api('/api/settings/twilio'); if(r.number===s.number){ s=r; const st=container.querySelector('.tw-status'); if(st) st.innerHTML=statusHtml(); } }catch{ /* keep the last status */ }
  }, 4000);
}

async function SettingsView(wrap){
  wrap.appendChild($(`<h1>${t('Settings')}</h1>`));
  wrap.appendChild($(`<div class="muted" style="margin-bottom:12px">${esc(tf('Settings for your workspace ({0}).', user.tenantName||''))}</div>`));

  const twilioCard=$('<div class="card"></div>'); wrap.appendChild(twilioCard);

async function CreateView(wrap){
  wrap.appendChild($(`<h1>${t('Create a new agent')}</h1>`));
  wrap.appendChild($(`<div class="muted" style="margin-bottom:12px">${t('Chat with Whaser to design your agent — describe what you want and the capabilities it needs (web search, webhooks, scheduled messages…). Whaser asks follow-ups, then builds the full agent from the conversation.')}</div>`));
  const card = $('<div class="card"></div>');
  card.innerHTML = `<div class="chat" id="chat"></div>
    <div class="composer"><input id="msg" placeholder="${t('Tell me about your agent…')}" disabled/><button class="primary" id="send" disabled>${t('Send')}</button></div>
    <div id="actions" style="margin-top:12px"></div>`;
  wrap.appendChild(card);
  const chat=card.querySelector('#chat'), input=card.querySelector('#msg'), sendBtn=card.querySelector('#send'), actions=card.querySelector('#actions');
  const addBub=(who,text)=>{ const b=$(`<div class="bub ${who}"></div>`); b.textContent=text; chat.appendChild(b); chat.scrollTop=chat.scrollHeight; };
  let sessionId=null, sending=false, buildShown=false, resultBox=null;
  const setBusy=(b)=>{ sending=b; input.disabled=b; sendBtn.disabled=b; };

  try {
    const s = await api('/api/wizard/start','POST');
    sessionId=s.sessionId; addBub('bot', s.greeting);
    input.disabled=false; sendBtn.disabled=false; input.focus();
  } catch(err){ addBub('bot',tf('⚠ {0}', err.message)); return; }

  const send = async ()=>{ const text=input.value.trim(); if(!text || sending) return; input.value=''; addBub('me',text); setBusy(true);
    const typing=$(`<div class="bub bot muted">${esc(t('typing…'))}</div>`); chat.appendChild(typing); chat.scrollTop=chat.scrollHeight;
    try{ const r = await api('/api/wizard/message','POST',{ sessionId, text });
      typing.remove(); addBub('bot', r.reply);
      if (r.readyToBuild || r.buildNow) showBuildButton();
      // The user explicitly asked to build (any language) → press "Build the agent" for them.
      if (r.buildNow){ const b=actions.querySelector('button'); if (b && !b.disabled){ setBusy(false); buildAgent(b); return; } }
    }catch(err){ typing.remove(); addBub('bot',tf('⚠ {0}', err.message)); }
    setBusy(false); input.focus();
  };
  sendBtn.onclick = send;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });

  function showBuildButton(){
    if (buildShown) return; buildShown=true;
    actions.innerHTML='';
    actions.appendChild($(`<div class="muted" style="margin-bottom:6px">${t('I have enough to design your agent — or keep chatting to refine.')}</div>`));
    const b=$(`<button class="primary">${t('Build the agent')}</button>`);
    b.onclick = ()=> buildAgent(b);
    actions.appendChild(b);
  }

  async function buildAgent(btn){
    btn.disabled=true;
    if (resultBox) resultBox.remove();
    resultBox=$(`<div class="card" style="margin-top:8px"><span class="muted">${t('Designing your agent…')}</span></div>`);
    actions.appendChild(resultBox); const box=resultBox;
    try{
      const r = await api('/api/wizard/finalize','POST',{ sessionId });
      const status = r.publishable ? `<span class="ok">${t('✓ valid & consistent — ready to publish')}</span>`
        : `<span class="err">${t('needs attention')}</span>`;
      box.innerHTML = `<h2>${t('Generated AgentSpec')}</h2><div style="margin-bottom:8px">${status}</div>
        ${r.schemaErrors.length?`<div class="err">${tf('Schema: {0}', r.schemaErrors.map(esc).join('; '))}</div>`:''}
        ${r.issues.length?`<div class="err">${tf('Consistency: {0}', r.issues.map(i=>esc(i.message)).join('; '))}</div>`:''}
        <pre>${esc(JSON.stringify(r.spec,null,2))}</pre>`;
      if (r.publishable){
        setBusy(true); // design is done — lock the chat while picking chats + publishing
        const connBox=$('<div></div>'); box.appendChild(connBox);
        const conns=buildConnectionsPicker(connBox, r.suggestedConnections||{}, { suggested:true, optional:true });
        let answerOnNumber=null; // the "answer on the business number" checkbox, when the workspace has one
        const publish=async (chats, saveBtn)=>{ saveBtn.disabled=true;
          try{ await api('/api/wizard/select-chats','POST',{ sessionId, chats });
            const pub=await api('/api/wizard/publish','POST',{ sessionId, connections: conns.get() });
            if (answerOnNumber && answerOnNumber.checked) await api('/api/agents/'+pub.agentId+'/twilio','POST',{ enabled:true });
            box.appendChild($(`<div class="ok" style="margin-top:10px">${tf('Published as {0} on {1}. Opening…', esc(pub.agentId), esc(pub.phoneNumberId))}</div>`));
            if (pub.ownerStyled) box.appendChild($(`<div class="muted" style="margin-top:4px">${t('✓ Tuned to write in your personal style.')}</div>`));
            setTimeout(()=>{ view='agent:'+pub.agentId; render(); }, 700);
          }catch(e){ alert(e.message); saveBtn.disabled=false; } };
        if (features.personalWhatsApp){
          box.appendChild($(`<div class="muted" style="margin-top:8px">${t('Choose which WhatsApp chats this agent should answer, then publish. Chats are optional — you can publish now and bind them later.')}</div>`));
          const pick=$('<div></div>'); box.appendChild(pick);
          // allowEmpty: publishing is never blocked by an unlinked WhatsApp or an empty selection.
          buildChatPicker(pick, [], t('Publish & bind a number'), publish, { allowEmpty: true });
        } else {
          const numBox=$('<div style="margin-top:10px"></div>'); box.appendChild(numBox);
          const pb=$(`<button class="primary" style="margin-top:10px">${t('Publish')}</button>`); box.appendChild(pb);
          pb.onclick=()=>publish([], pb);
          api('/api/settings/twilio').then(ts=>{ if (!ts.number) return;
            const lbl=$(`<label style="display:flex;gap:8px;align-items:center;color:var(--text);font-size:14.5px"><input type="checkbox" style="width:auto"/><span></span></label>`);
            lbl.querySelector('span').textContent = tf('Answer on your WhatsApp business number ({0})', ltr(ts.number)) + (ts.agentName ? ' — ' + tf('instead of “{0}”', ts.agentName) : '');
            answerOnNumber=lbl.querySelector('input'); answerOnNumber.checked=!ts.agentName; numBox.appendChild(lbl);
          }).catch(()=>{});
        }
      } else {
        btn.disabled=false; // let the user refine in chat and rebuild
      }
    }catch(err){ box.innerHTML=`<div class="err">${esc(err.message)}</div>`; btn.disabled=false; }
  }
}

(async function init(){ if (token){ try{ const d=await api('/api/me'); user=d.user; mode=d.mode||'stub'; whatsapp=d.whatsapp||whatsapp; features=d.features||features; billing=d.billing||billing; }catch{} } render(); })();
</script>
</body>
</html>
